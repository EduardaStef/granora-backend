name: Fluxo CI

on:
  push:
    branches: [ "main", "feat/melhoria-esteira" ]
  pull_request:
    branches: [ "main", "develop" ]


jobs:

  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USUARIO }}
          POSTGRES_PASSWORD: ${{ secrets.DB_SENHA }}
          POSTGRES_DB: ${{ secrets.DB_NOME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Preparando a JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build com Maven
        run: mvn --batch-mode package --file pom.xml
        env:
          DB_HOST: localhost
          DB_PORTA: 5432
          DB_NOME: ${{ secrets.DB_NOME }}
          DB_USUARIO: ${{ secrets.DB_USUARIO }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Atualiza grafico de dependencias
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  Qualidade:
    needs: Build
    runs-on: ubuntu-latest
    name: Checkstyle Review
    permissions: { checks: write, contents: read }
    steps:
      - uses: actions/checkout@v6

      - name: Unimport
        uses: hakancelikdev/unimport@1.4.0
        with:
          extra_args: "--check --gitignore --ignore-init"

      - name: Checkstyle
        uses: dbelyaev/action-checkstyle@v3
        with:
          reporter: github-pr-check
          level: warning
          checkstyle_config: config/checkstyle/checkstyle.xml

  Issue:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: "actions/checkout@v6"
      - name: "Issues"
        uses: "alstr/todo-to-issue-action@v5"
        with:
          INSERT_ISSUE_URLS: "true"
      - name: Set Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit and Push Changes
        run: |
          git pull
          git add -A
          if [[ `git status --porcelain` ]]; then
            git commit -m "Adicionando automaticamente o link da issue ao TODOs"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi