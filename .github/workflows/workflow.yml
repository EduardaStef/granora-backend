name: Fluxo CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]


jobs:

  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USUARIO }}
          POSTGRES_PASSWORD: ${{ secrets.DB_SENHA }}
          POSTGRES_DB: ${{ secrets.DB_NOME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Preparando a JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build com Maven
        run: mvn --batch-mode package --file pom.xml
        env:
               DB_HOST: localhost
               DB_PORTA: 5432
               DB_NOME: ${{ secrets.DB_NOME }}
               DB_USUARIO: ${{ secrets.DB_USUARIO }}
               DB_SENHA: ${{ secrets.DB_SENHA }}
      - name: Atualiza grafico de dependencias
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  Qualidade:
    needs: Build
    runs-on: ubuntu-latest
    name: Checkstyle Review
    permissions: {pull-requests: write, contents: read}
    steps:
      - uses: actions/checkout@v6
      - uses: dbelyaev/action-checkstyle@v3
        with:
          reporter: github-pr-review
          level: warning
