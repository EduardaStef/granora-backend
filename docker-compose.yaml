services:
  postgres:
    image: "postgres:16"
    environment:
      - POSTGRES_USER=${DB_USUARIO}
      - POSTGRES_PASSWORD=${DB_SENHA}
      - POSTGRES_DB=${DB_NOME}
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - 8080:8080
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_USUARIO=${DB_USUARIO}
      - DB_SENHA=${DB_SENHA}
      - DB_NOME=${DB_NOME}
      - DB_PORT=5432